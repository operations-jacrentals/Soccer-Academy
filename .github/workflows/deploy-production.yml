name: Deploy to Production

# Production is a deliberate, tagged promotion — not an auto-deploy.
#   * Publishing a GitHub Release deploys that tag.
#   * workflow_dispatch lets you redeploy any tag/SHA (rollback / manual promote).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or SHA to deploy (rollback / manual promotion)"
        required: true

# Never cancel a production deploy in flight; serialize them.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    # The `production` environment must have required reviewers configured in
    # repo settings — that is the manual approval gate. See docs/environments.md.
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    env:
      APP_ENV: production
    steps:
      - name: Resolve and validate deploy ref
        id: ref
        # Never inline ${{ ... }} into a run: script — tag names and dispatch
        # inputs are attacker-influenceable and can carry shell metacharacters.
        # Pass them through env and validate against a conservative charset.
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          REF="${RELEASE_TAG:-$INPUT_REF}"
          if [ -z "$REF" ]; then
            echo "No ref to deploy." >&2
            exit 1
          fi
          case "$REF" in
            *[!A-Za-z0-9._/-]*)
              echo "Refusing to deploy unsafe ref: $REF" >&2
              exit 1
              ;;
          esac
          printf 'value=%s\n' "$REF" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.value }}

      - name: Validate feature flags
        run: python scripts/validate-flags.py

      # ---------------------------------------------------------------------
      # TODO: build the app, then deploy to production.
      # Add your target's credentials as *Environment secrets* on `production`.
      #
      #   Vercel:  vercel deploy --prod --token=$VERCEL_TOKEN
      #   Netlify: netlify deploy --prod --site $NETLIFY_SITE_ID
      #   rsync:   rsync -az ./dist/ $SSH_USER@$SSH_HOST:/var/www/production/
      # ---------------------------------------------------------------------
      - name: Deploy
        env:
          DEPLOY_REF: ${{ steps.ref.outputs.value }}
        run: |
          echo "Deploying ref '$DEPLOY_REF' to PRODUCTION (APP_ENV=$APP_ENV)"
          echo "TODO: add the real deploy command — see docs/WORKFLOW.md"
