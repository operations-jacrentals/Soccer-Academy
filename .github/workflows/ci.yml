name: CI

# Runs on every pull request into main, and on pushes to main after merge.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-flags:
    name: Validate feature flags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate flags/flags.json
        run: python scripts/validate-flags.py

  build-test:
    name: Build & test family calendar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/family-calendar/package-lock.json
      - name: Install calendar dependencies
        working-directory: apps/family-calendar
        run: npm ci
      - name: Lint calendar
        working-directory: apps/family-calendar
        run: npm run lint
      - name: Build and test calendar
        working-directory: apps/family-calendar
        run: npm test
