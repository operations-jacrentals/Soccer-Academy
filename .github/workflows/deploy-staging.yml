      #   rsync:   rsync -az ./dist/ $SSH_USER@$SSH_HOST:/var/www/staging/
      # ---------------------------------------------------------------------
      - name: Deploy
        run: |
          echo "Deploying commit ${GITHUB_SHA} to STAGING (APP_ENV=$APP_ENV)"
