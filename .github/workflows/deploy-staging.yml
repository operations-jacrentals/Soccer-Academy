name: Deploy to Staging

# Every merge to trunk auto-deploys to staging.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# One staging deploy at a time; newer pushes supersede in-flight ones.
concurrency:
  group: deploy-staging
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    env:
      APP_ENV: staging
    steps:
      - uses: actions/checkout@v4

      - name: Validate feature flags
        run: |
          python scripts/validate-flags.py

      # ---------------------------------------------------------------------
