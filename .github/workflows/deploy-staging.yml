name: Deploy to Staging

# Every merge to trunk auto-deploys to staging.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# One staging deploy at a time; newer pushes supersede in-flight ones.
concurrency:
  group: deploy-staging
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    env:
      APP_ENV: staging
    steps:
      - uses: actions/checkout@v4

      - name: Validate feature flags
        run: |
          python scripts/validate-flags.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install MkDocs
        run: pip install mkdocs mkdocs-material

      # GitHub Pages serves one site per repo, so staging validates that the
      # curriculum site builds cleanly — catching breakage before a production
      # release can promote it — rather than publishing a separate site.
      - name: Build curriculum site (staging validation)
        run: mkdocs build --site-dir site
