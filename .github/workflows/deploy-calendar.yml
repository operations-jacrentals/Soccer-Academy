name: Deploy Family Calendar

# The calendar is a Cloudflare Worker with a D1 database, so it deploys on its
# own track rather than through the curriculum's MkDocs publish. Soccer-Academy
# is the source of truth: merging to main ships staging, and a release (or a
# manual dispatch) promotes to production behind the reviewer gate.
on:
  push:
    branches: [main]
    paths:
      - "apps/family-calendar/**"
      - ".github/workflows/deploy-calendar.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Which environment to deploy"
        required: true
        default: staging
        type: choice
        options: [staging, production]

# Never overlap deploys to the same environment; a newer staging push supersedes
# an in-flight one, while production deploys queue instead of cancelling.
concurrency:
  group: deploy-calendar-${{ github.event_name == 'release' && 'production' || inputs.target || 'staging' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy calendar
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'release' && 'production' || inputs.target || 'staging' }}
      url: ${{ github.event_name == 'release' && vars.PRODUCTION_URL || vars.STAGING_URL }}
    defaults:
      run:
        working-directory: apps/family-calendar
    env:
      APP_ENV: ${{ github.event_name == 'release' && 'production' || inputs.target || 'staging' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Optional; defaults are derived below so a first deploy needs no variables.
      WORKER_NAME: ${{ vars.CALENDAR_WORKER_NAME }}
      D1_NAME: ${{ vars.CALENDAR_D1_NAME }}
    steps:
      - uses: actions/checkout@v4

      # Until the Cloudflare secrets exist this skips rather than fails. A deploy
      # that is red on every merge before it has ever been configured only trains
      # everyone to ignore red. Once the secrets are set, a failure here is real.
      # See docs/calendar-deploy.md for the one-time setup.
      - name: Check deploy credentials
        id: creds
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Calendar deploy is not configured yet, so nothing was deployed. Missing:$missing on the '$APP_ENV' environment. Add them under Settings then Environments then $APP_ENV, and re-run. See docs/calendar-deploy.md."
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "Credentials present; deploying to '$APP_ENV'."

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.configured == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/family-calendar/package-lock.json

      - name: Install dependencies
        if: steps.creds.outputs.configured == 'true'
        run: npm ci

      - name: Lint and test
        if: steps.creds.outputs.configured == 'true'
        run: |
          npm run lint
          npm test

      - name: Resolve deploy names
        id: names
        if: steps.creds.outputs.configured == 'true'
        run: |
          worker="${WORKER_NAME:-family-calendar}"
          database="${D1_NAME:-wall-ball-calendar}"
          if [ "$APP_ENV" != "production" ]; then
            worker="$worker-$APP_ENV"
            database="$database-$APP_ENV"
          fi
          echo "worker=$worker" >> "$GITHUB_OUTPUT"
          echo "database=$database" >> "$GITHUB_OUTPUT"
          echo "Deploying worker '$worker' against D1 '$database'."

      # The build writes dist/server/wrangler.json with a placeholder D1 id, so
      # the real database is resolved by name here. That keeps one less id in
      # repository configuration and makes the two environments symmetrical.
      - name: Resolve the D1 database id
        id: d1
        if: steps.creds.outputs.configured == 'true'
        env:
          DATABASE: ${{ steps.names.outputs.database }}
        run: |
          npx wrangler d1 list --json > /tmp/d1.json
          id=$(node -e 'const list = require("/tmp/d1.json"); const match = list.find((db) => db.name === process.env.DATABASE); process.stdout.write(match ? (match.uuid || match.id || "") : "");')
          if [ -z "$id" ]; then
            echo "::error::No D1 database named '$DATABASE' in this Cloudflare account." >&2
            echo "Create it once with: npx wrangler d1 create $DATABASE" >&2
            echo "See docs/calendar-deploy.md." >&2
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "Resolved '$DATABASE'."

      - name: Build
        if: steps.creds.outputs.configured == 'true'
        run: npm run build

      # Patch the generated config rather than maintaining a second one by hand.
      # The script is committed so it can be run and verified locally with the
      # same code CI uses, instead of an inline expression nobody can test.
      - name: Prepare the Worker configuration
        if: steps.creds.outputs.configured == 'true'
        env:
          CALENDAR_WORKER: ${{ steps.names.outputs.worker }}
          CALENDAR_D1_NAME: ${{ steps.names.outputs.database }}
          CALENDAR_D1_ID: ${{ steps.d1.outputs.id }}
          CALENDAR_ALLOWED_EMAILS: ${{ vars.CALENDAR_ALLOWED_EMAILS }}
          CALENDAR_HOUSEHOLDS: ${{ vars.CALENDAR_HOUSEHOLDS }}
          CALENDAR_DEFAULT_HOUSEHOLD: ${{ vars.CALENDAR_DEFAULT_HOUSEHOLD }}
        run: npm run deploy:config

      - name: Verify the artifact and the deploy plan
        if: steps.creds.outputs.configured == 'true'
        run: |
          npm run validate:artifact
          npx wrangler deploy -c dist/server/wrangler.json --dry-run --outdir /tmp/calendar-dry

      - name: Apply D1 migrations
        if: steps.creds.outputs.configured == 'true'
        run: npx wrangler d1 migrations apply DB --remote -c dist/server/wrangler.json

      - name: Deploy
        id: deploy
        if: steps.creds.outputs.configured == 'true'
        run: npx wrangler deploy -c dist/server/wrangler.json

      # A deploy that uploads successfully but serves a 500 is not a deploy.
      # Confirm the running Worker actually returns the calendar.
      - name: Smoke test the deployment
        if: steps.creds.outputs.configured == 'true'
        env:
          SITE_URL: ${{ github.event_name == 'release' && vars.PRODUCTION_URL || vars.STAGING_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::warning::No URL variable set for '$APP_ENV', so the smoke test was skipped."
            exit 0
          fi
          for attempt in 1 2 3 4 5 6; do
            status=$(curl -s -o /tmp/body.html -w '%{http_code}' "$SITE_URL" || true)
            if [ "$status" = "200" ] && grep -q "planner-app" /tmp/body.html; then
              echo "$SITE_URL served the calendar."
              exit 0
            fi
            echo "Attempt $attempt returned status $status; retrying."
            sleep 10
          done
          echo "::error::$SITE_URL did not serve the calendar after the deploy." >&2
          exit 1
